buildscript {
    ext {
        agp_version = '9.3.2'
        kotlin_version = '2.4.10'
        kotlin_coroutines_version = '1.11.0'
        navigation_version = "2.10.0"
        hilt_version = '2.60.1'
        room_version = '2.8.4'
        core_version = '1.19.0'
        desugaring_version = '2.1.3'

        min_sdk = 24
        target_sdk = 37
        ndk_version = "28.2.13676358"

        detekt_version = '1.23.8'
    }

    dependencies {
        // Hilt isn't compatible with the new plugin syntax yet.
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
    }
}

plugins {
    // Android studio doesn't understand this syntax
    //noinspection GradlePluginVersion
    id "com.android.application" version "$agp_version" apply false
    id "androidx.navigation.safeargs.kotlin" version "$navigation_version" apply false
    //noinspection GradlePluginVersion
    id 'com.android.library' version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlin_version" apply false
    id "com.google.devtools.ksp" version '2.3.6' apply false
    // We use spotless in the root build.gradle to apply to all modules.
    id "com.diffplug.spotless" version "8.10.1" apply true
    id "io.gitlab.arturbosch.detekt" version "$detekt_version" apply false
    // Aggregates app/musikr into one SonarQube project; see docs/code-quality.md.
    id "org.sonarqube" version "7.5.0.8588" apply true
}

// detekt is applied per-module below rather than via `apply true` here because :libusbdac
// is also a standalone repo that applies and configures its own detekt in its own
// build.gradle -- applying it again from this subprojects block would double-apply it.
subprojects { subproject ->
    if (subproject.name != 'libusbdac') {
        subproject.apply plugin: 'io.gitlab.arturbosch.detekt'
        subproject.detekt {
            buildUponDefaultConfig = true
            baseline = subproject.file("$rootDir/config/detekt/baseline-${subproject.name}.xml")
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "auxio"
        property "sonar.projectName", "Auxio"
        // Server is self-hosted and loopback-only; see ~/claude/sonarqube/README.md.
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
    }
}

// :libusbdac is excluded from both targets below, same as the detekt exclusion above --
// it's a standalone repo with its own license and its own formatting setup, so applying
// Auxio's NOTICE license header to its sources would be wrong.
spotless {
    kotlin {
        target "{app,musikr}/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("NOTICE")
    }

    cpp {
        target("{app,musikr}/src/**/cpp/*.cpp", "{app,musikr}/src/**/cpp/*.h", "{app,musikr}/src/**/cpp/*.hpp")
        eclipseCdt().configFile("eclipse-cdt.xml")
        licenseHeaderFile("NOTICE")
    }
}
