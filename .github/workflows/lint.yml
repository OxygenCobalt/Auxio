name: Android Lint

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check formatting with spotless
      run: ./gradlew spotlessCheck
    - name: Build native code for clang-tidy
      run: ./gradlew :musikr:externalNativeBuildDebug :libusbdac:externalNativeBuildDebug
    - name: Static analysis with clang-tidy
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      run: |
        tools/run-clang-tidy.sh musikr
        tools/run-clang-tidy.sh libusbdac
    - name: Static analysis with detekt
      run: ./gradlew :app:detekt :musikr:detekt :libusbdac:detekt
    - name: Test musikr with Gradle
      run: ./gradlew musikr:testDebug
